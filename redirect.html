<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Redirect</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
            margin: 0;
        }
        video {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <video id="introVideo" autoplay>
        <source src="https://files.catbox.moe/n5i9l9.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    
    <script>
        document.getElementById("introVideo").addEventListener("ended", function() {
            window.location.href = "https://your-redirect-url.com";
        });
    </script>
</body>
</html>
